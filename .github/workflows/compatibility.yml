name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  cecil:
    name: Mono.Cecil ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version:
          - 0.11.5
          - 0.11.6
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/AspectN.Cecil.Tests/AspectN.Cecil.Tests.csproj -p:CecilVersion=${{ matrix.version }}

      - name: Test
        run: dotnet test tests/AspectN.Cecil.Tests/AspectN.Cecil.Tests.csproj -c Release --no-restore -p:CecilVersion=${{ matrix.version }} --logger "trx;LogFileName=cecil-${{ matrix.version }}.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecil-${{ matrix.version }}-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error

  fody-cecil:
    name: Fody Cecil identity and Rougamo compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out AspectN
        uses: actions/checkout@v4

      - name: Check out pinned Rougamo
        uses: actions/checkout@v4
        with:
          repository: inversionhourglass/Rougamo
          ref: c4071b5e3ded79ee30c047cf45685637c542fa26
          path: artifacts/rougamo

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Fody Cecil identity and shared contract
        run: dotnet test tests/AspectN.Cecil.Fody.Tests/AspectN.Cecil.Fody.Tests.csproj -c Release --logger "trx;LogFileName=cecil-fody.trx" --results-directory artifacts/test-results

      - name: Pack local Fody adapter
        run: |
          dotnet pack src/AspectN/AspectN.csproj -c Release --no-restore -p:Version=0.0.0-fody-ci --output artifacts/fody-packages
          dotnet pack src/AspectN.Cecil.Fody/AspectN.Cecil.Fody.csproj -c Release --no-restore -p:Version=0.0.0-fody-ci --output artifacts/fody-packages

      - name: Build pinned Rougamo with Fody adapter package
        run: |
          test "$(git -C artifacts/rougamo rev-parse HEAD)" = "c4071b5e3ded79ee30c047cf45685637c542fa26"
          dotnet add artifacts/rougamo/src/Rougamo.Fody/Rougamo.Fody.csproj package AspectN.Cecil.Fody --version 0.0.0-fody-ci --no-restore
          dotnet restore artifacts/rougamo/src/Rougamo.Fody/Rougamo.Fody.csproj --source "${{ github.workspace }}/artifacts/fody-packages" --source https://api.nuget.org/v3/index.json
          dotnet build artifacts/rougamo/src/Rougamo.Fody/Rougamo.Fody.csproj -c Release --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecil-fody-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error

  roslyn:
    name: Roslyn ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version:
          - 4.12.0
          - 5.6.0
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/AspectN.Roslyn.Tests/AspectN.Roslyn.Tests.csproj -p:RoslynVersion=${{ matrix.version }}

      - name: Test
        run: dotnet test tests/AspectN.Roslyn.Tests/AspectN.Roslyn.Tests.csproj -c Release --no-restore -p:RoslynVersion=${{ matrix.version }} --logger "trx;LogFileName=roslyn-${{ matrix.version }}.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roslyn-${{ matrix.version }}-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error

  legacy:
    name: Pinned Legacy oracle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out AspectN
        uses: actions/checkout@v4

      - name: Check out pinned Legacy oracle
        uses: actions/checkout@v4
        with:
          repository: inversionhourglass/Shared.Cecil.AspectN
          ref: 03a9d1030f92a64449b6220eb45d7198d31653db
          path: artifacts/legacy-oracle/Shared.Cecil.AspectN

      - name: Check out pinned Rougamo fixtures
        uses: actions/checkout@v4
        with:
          repository: inversionhourglass/Rougamo
          ref: c4071b5e3ded79ee30c047cf45685637c542fa26
          path: artifacts/rougamo

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify pinned revisions
        shell: pwsh
        run: |
          $oraclePin = "03a9d1030f92a64449b6220eb45d7198d31653db"
          $rougamoPin = "c4071b5e3ded79ee30c047cf45685637c542fa26"
          $oracleRoot = "artifacts/legacy-oracle/Shared.Cecil.AspectN"
          $oracleRevision = (git -C $oracleRoot rev-parse HEAD).Trim()
          $rougamoRevision = (git -C artifacts/rougamo rev-parse HEAD).Trim()
          if ($oracleRevision -ne $oraclePin) {
            throw "Legacy oracle revision is $oracleRevision; expected $oraclePin."
          }
          if ($rougamoRevision -ne $rougamoPin) {
            throw "Rougamo revision is $rougamoRevision; expected $rougamoPin."
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $oracleRoot ".aspectn-oracle-commit"),
            $oraclePin,
            [System.Text.Encoding]::ASCII)

      - name: Build pinned Rougamo fixture assemblies
        run: |
          dotnet build artifacts/rougamo/test/TestAssemblies/SignatureUsage/SignatureUsage.csproj -c Release -f net8.0
          dotnet build artifacts/rougamo/test/TestAssemblies/PatternUsage/PatternUsage.csproj -c Release -f net8.0

      - name: Restore Legacy oracle tests
        run: dotnet restore tests/AspectN.LegacyOracle.Tests/AspectN.LegacyOracle.Tests.csproj --locked-mode -p:LegacyOracleRoot="${{ github.workspace }}/artifacts/legacy-oracle/Shared.Cecil.AspectN" -p:RougamoRoot="${{ github.workspace }}/artifacts/rougamo"

      - name: Test Legacy parity
        run: dotnet test tests/AspectN.LegacyOracle.Tests/AspectN.LegacyOracle.Tests.csproj -c Release --no-restore -p:LegacyOracleRoot="${{ github.workspace }}/artifacts/legacy-oracle/Shared.Cecil.AspectN" -p:RougamoRoot="${{ github.workspace }}/artifacts/rougamo" --logger "trx;LogFileName=legacy.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-oracle-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error
