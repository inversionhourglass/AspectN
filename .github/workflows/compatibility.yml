name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  reflection-runtime-fallback:
    name: Reflection netstandard asset on .NET 7
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            7.0.20
      - name: Build netstandard assets
        run: dotnet build src/AspectN.Reflection/AspectN.Reflection.csproj -c Release -f netstandard2.0
      - name: Verify function pointer declaration identity on old runtime
        run: powershell -NoProfile -File eng/verify-function-pointer-fallback.ps1 -RuntimeVersion 7.0.20

  cecil:
    name: Mono.Cecil ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version:
          - 0.11.5
          - 0.11.6
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/AspectN.Cecil.Tests/AspectN.Cecil.Tests.csproj -p:CecilVersion=${{ matrix.version }}

      - name: Test
        run: dotnet test tests/AspectN.Cecil.Tests/AspectN.Cecil.Tests.csproj -c Release --no-restore -p:CecilVersion=${{ matrix.version }} --logger "trx;LogFileName=cecil-${{ matrix.version }}.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecil-${{ matrix.version }}-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error

  fody-cecil:
    name: Fody Cecil identity and Rougamo compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out AspectN
        uses: actions/checkout@v4

      - name: Check out pinned Rougamo
        uses: actions/checkout@v4
        with:
          repository: inversionhourglass/Rougamo
          ref: c4071b5e3ded79ee30c047cf45685637c542fa26
          path: artifacts/rougamo
          submodules: recursive

      # Rougamo.Fody 无条件导入 shared/ 下的子模块 projitems，缺少子模块时项目求值直接 MSB4019。
      # 空的 props 文件阻止嵌套 checkout 向上继承 AspectN 的中央包管理，避免 NU1008。
      - name: Isolate Rougamo MSBuild configuration
        shell: bash
        run: |
          echo '<Project />' > artifacts/rougamo/Directory.Build.props
          echo '<Project />' > artifacts/rougamo/Directory.Packages.props

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Fody Cecil identity and shared contract
        run: dotnet test tests/AspectN.Cecil.Fody.Tests/AspectN.Cecil.Fody.Tests.csproj -c Release --logger "trx;LogFileName=cecil-fody.trx" --results-directory artifacts/test-results

      - name: Pack local Fody adapter
        run: |
          dotnet pack src/AspectN/AspectN.csproj -c Release --no-restore -p:Version=0.0.0-fody-ci --output artifacts/fody-packages
          dotnet pack src/AspectN.Cecil.Fody/AspectN.Cecil.Fody.csproj -c Release --no-restore -p:Version=0.0.0-fody-ci --output artifacts/fody-packages

      - name: Build pinned Rougamo with Fody adapter package
        run: |
          test "$(git -C artifacts/rougamo rev-parse HEAD)" = "c4071b5e3ded79ee30c047cf45685637c542fa26"
          dotnet add artifacts/rougamo/src/Rougamo.Fody/Rougamo.Fody.csproj package AspectN.Cecil.Fody --version 0.0.0-fody-ci --no-restore
          dotnet restore artifacts/rougamo/src/Rougamo.Fody/Rougamo.Fody.csproj --source "${{ github.workspace }}/artifacts/fody-packages" --source https://api.nuget.org/v3/index.json
          dotnet build artifacts/rougamo/src/Rougamo.Fody/Rougamo.Fody.csproj -c Release --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecil-fody-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error

  roslyn:
    name: Roslyn ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version:
          - 4.12.0
          - 5.6.0
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/AspectN.Roslyn.Tests/AspectN.Roslyn.Tests.csproj -p:RoslynVersion=${{ matrix.version }}

      - name: Test
        run: dotnet test tests/AspectN.Roslyn.Tests/AspectN.Roslyn.Tests.csproj -c Release --no-restore -p:RoslynVersion=${{ matrix.version }} --logger "trx;LogFileName=roslyn-${{ matrix.version }}.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roslyn-${{ matrix.version }}-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error
